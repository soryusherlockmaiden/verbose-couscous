[project]
name = "acgs"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = []

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["mypy==1.15.0", "pytest==8.3.5", "ruff==0.11.13"]

[tool.uv]
required-version = "==0.13.7"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "evidence/m2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
